[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-agent-orchestrator"
version = "0.1.0"
description = "Control plane for Hermes-backed multi-agent workflows"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
evals = [
    "ruff>=0.4",
    "bandit>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "anyio[trio]>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aao_cli", "contracts", "adapters", "orchestrator", "evals", "storage", "telemetry", "spike"]

[project.scripts]
aao = "aao_entry:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
